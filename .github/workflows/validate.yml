name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  v6-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - run: npm run typecheck --prefix cli
      - run: npm test --prefix cli
      - run: npm run validate --prefix cli
      - run: npm run check:drift --prefix cli
      - run: npm run bundle --prefix cli
      - name: Windows launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'kit smoke é'
          New-Item -ItemType Directory -Path $repo | Out-Null
          git -C $repo init
          ./scripts/install-all.ps1 --scope project --repo $repo --profile full --dry-run
      - name: macOS launcher smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          repo="$RUNNER_TEMP/kit smoke é"
          mkdir -p "$repo"
          git -C "$repo" init
          bash scripts/install-all.sh --scope project --repo "$repo" --profile full --dry-run

  legacy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell and Pester
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck'
      - name: Validate legacy migration source
        shell: pwsh
        run: |
          ./scripts/validate-bundle.ps1
          $result = Invoke-Pester ./tests/Pester/ -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed" }
