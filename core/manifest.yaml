schema_version: 1
kit_version: 6.3.0

model_tiers:
  fast:
    purpose: Narrow repeatable extraction, routing, or deterministic assistance.
  standard:
    purpose: Everyday bounded repository work.
  deep:
    purpose: Coding, review, test design, and diagnosis.
  premium:
    purpose: Difficult independent reasoning and high-value decisions.

skills:
  - { id: build, source: core/skills/build/SKILL.md, default: true }
  - { id: design, source: core/skills/design/SKILL.md, default: true }
  - { id: grill, source: core/skills/grill/SKILL.md, default: true }
  - { id: review, source: core/skills/review/SKILL.md, default: true }
  - { id: pr-ready, source: core/skills/pr-ready/SKILL.md, default: true }
  - { id: threat-model, source: core/skills/threat-model/SKILL.md, default: true }
  - { id: wiki, source: core/skills/wiki/SKILL.md, default: true }
  - { id: async, source: core/skills/async/SKILL.md, default: true }
  - { id: backend, source: core/skills/backend/SKILL.md, default: true }
  - { id: components, source: core/skills/components/SKILL.md, default: true }
  - { id: debug, source: core/skills/debug/SKILL.md, default: true }
  - { id: deslop, source: core/skills/deslop/SKILL.md, default: true }
  - { id: frontend, source: core/skills/frontend/SKILL.md, default: true }
  - { id: migrate, source: core/skills/migrate/SKILL.md, default: true }
  - { id: perf, source: core/skills/perf/SKILL.md, default: true }
  - { id: python, source: core/skills/python/SKILL.md, default: true }
  - { id: security, source: core/skills/security/SKILL.md, default: true }
  - { id: test, source: core/skills/test/SKILL.md, default: true }
  - { id: typescript, source: core/skills/typescript/SKILL.md, default: true }

agents:
  - id: architect
    description: Read-only repository architecture and change-boundary specialist.
    source: core/agents/architect.md
    kind: subagent
    permission_class: read-only
    model_tier: deep
    conditional: true
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: architecture-decision
  - id: repo-scout
    description: Read-only repository discovery for bounded local codebase questions.
    source: core/agents/repo-scout.md
    kind: subagent
    permission_class: read-only
    model_tier: fast
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: scout-brief
  - id: coder
    description: Production implementation with minimum contract coverage.
    source: core/agents/coder.md
    kind: subagent
    permission_class: workspace-write
    write_scope: [production, tests]
    model_tier: standard
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: coder-report
  - id: reviewer
    description: Independent implementation, design, and test-delta reviewer.
    source: core/agents/reviewer.md
    kind: subagent
    permission_class: read-only
    model_tier: standard
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: review-report
  - id: simple-reviewer
    description: Conditional read-only PR-ready file-unit review for broad diffs.
    source: core/agents/simple-reviewer.md
    kind: subagent
    permission_class: read-only
    model_tier: fast
    conditional: true
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: file-review-report
  - id: test-engineer
    description: Independent adversarial test design and test-only hardening.
    source: core/agents/test-engineer.md
    kind: subagent
    permission_class: test-write
    write_scope: [tests, fixtures, test-utilities]
    model_tier: standard
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: test-engineer-report
  - id: diagnostician
    description: Read-only root-cause discrimination for ambiguous or repeated failures.
    source: core/agents/diagnostician.md
    kind: subagent
    permission_class: read-only
    model_tier: deep
    conditional: true
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: failure-brief
  - id: sage
    description: Read-only principal-engineering second opinion for difficult judgments.
    source: core/agents/sage.md
    kind: subagent
    permission_class: read-only
    model_tier: premium
    conditional: true
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: sage-decision-memo
  - id: security-reviewer
    description: Conditional concrete trust-boundary and attack-path reviewer.
    source: core/agents/security-reviewer.md
    kind: specialist
    permission_class: read-only
    model_tier: deep
    conditional: true
    default: true
    hosts: [codex, claude, opencode, copilot, muse]
    return_packet: security-review-report

packs:
  ui:
    default: false
    agents:
      - id: browser-qa
        description: Browser execution and evidence collection for user-visible flows.
        source: packs/ui/agents/browser-qa.md
        kind: specialist
        permission_class: artifact-write
        write_scope: [temporary-artifacts]
        model_tier: standard
        hosts: [codex, claude, opencode, copilot, muse]
        return_packet: browser-qa-report
      - id: ui-critic
        description: Independent visual and UX judgment against a UI Design Contract.
        source: packs/ui/agents/ui-critic.md
        kind: specialist
        permission_class: read-only
        model_tier: standard
        hosts: [codex, claude, opencode, copilot, muse]
        return_packet: ui-critique
instruction_fragments:
  orchestrator: core/orchestrator.md
  opencode_primary: core/opencode-primary.md
